[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-serve-alp"
version = "0.2.2"
description = "ALP calling and validated structured generation for native MLX-Serve."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["alp-schema-mcp==0.3.0", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "jsonschema>=4.25,<5", "xgrammar==0.2.8", "httpx>=0.28,<1", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "build>=1,<2", "ruff>=0.14"]

[project.urls]
Repository = "https://github.com/omni-runtime/mlx-serve-alp"
Issues = "https://github.com/omni-runtime/mlx-serve-alp/issues"

[project.scripts]
mlx-serve-alp = "mlx_serve_alp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
