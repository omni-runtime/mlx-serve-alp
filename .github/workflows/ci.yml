name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build ruff
      - run: ruff check src tests scripts
      - run: python -m build
  authorized-tests:
    if: vars.PRIVATE_DEPENDENCY_TESTS == 'enabled' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: dependency
        run: |
          python - <<'PYTHON'
          import json, os
          revision = json.load(open('contracts.lock.json'))['contracts']['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PYTHON
      - uses: actions/checkout@v4
        with:
          repository: omni-runtime/alp_schema_mcp
          ref: ${{ steps.dependency.outputs.revision }}
          token: ${{ secrets.PRIVATE_DEPENDENCIES_TOKEN }}
          path: .deps/alp_schema_mcp
          persist-credentials: false
      - run: python -m pip install ./.deps/alp_schema_mcp
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
